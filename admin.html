<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - Notícias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { padding: 24px; }
      .required::after { content: " *"; color: #d00; }
      .table thead th { white-space: nowrap; }
      .thumb-preview { max-height: 80px; border-radius: 8px; }
      .small-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 12px; }
    </style>
  </head>
<body>
    <div class="modal fade" id="authModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Autenticação Administrador</h5>
          </div>
          <div class="modal-body">
            <label for="passcode">Introduza a palavra-passe:</label>
            <input type="password" id="passcode" class="form-control">
          </div>
          <div class="modal-footer">
            <button id="btnAuth" class="btn btn-primary">Entrar</button>
          </div>
        </div>
      </div>
    </div>

    <div id="adminContent" style="display:none;">
      <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 m-0">Notícias (Admin)</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newsModal">+ Nova Notícia</button>
      </div>

      <div class="alert alert-info">
        <div><strong>Dica:</strong> As imagens são convertidas para <code>.webp</code> no navegador antes do envio para reduzir tamanho sem perder qualidade perceptível.</div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label">Pesquisar</label>
          <input id="search" type="search" class="form-control" placeholder="Título, autor...">
        </div>
        <div class="col-md-3">
          <label class="form-label">Categoria</label>
          <input id="filterCategory" type="text" class="form-control" placeholder="ex: Habitação">
        </div>
        <div class="col-md-3">
          <label class="form-label">Tag</label>
          <input id="filterTag" type="text" class="form-control" placeholder="ex: Emprego">
        </div>
        <div class="col-md-2 d-flex align-items-end">
          <button id="btnRefresh" class="btn btn-outline-secondary w-100">Atualizar</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-striped align-middle" id="tbl">
          <thead>
            <tr>
              <th style="width:90px">Capa</th>
              <th>Título</th>
              <th>Data</th>
              <th>Autor</th>
              <th>Categorias</th>
              <th>Tags</th>
              <th style="width:160px">Ações</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div> <!-- container -->
    </div> <!-- adminContent -->

    <!-- Modal -->
    <div class="modal fade" id="newsModal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Nova Notícia</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="frm">
              <input type="hidden" id="id">
              <input type="hidden" id="slug" value="">
              <div class="row g-3">
                <div class="col-md-8">
                  <label class="form-label required">Título</label>
                  <input id="title" class="form-control" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label required">Data</label>
                  <input id="date" type="datetime-local" class="form-control" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Autor</label>
                  <input id="author" class="form-control" value="H&S Angola">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Capa (URL)</label>
                  <div class="input-group">
                    <input id="cover" class="form-control" placeholder="https://.../cover.webp">
                    <button class="btn btn-outline-secondary" type="button" id="btnPaste">Colar</button>
                  </div>
                  <div class="form-text small-mono" id="coverStatus"></div>
                </div>

                <div class="col-md-8">
                  <label class="form-label">Carregar imagem (qualquer formato)</label>
                  <input id="coverFile" type="file" accept="image/*" class="form-control">
                  <div class="form-text">Será convertida para <code>.webp</code> antes de enviar.</div>
                </div>
                <div class="col-md-4 d-flex align-items-center">
                  <img id="preview" class="thumb-preview ms-auto d-none" alt="preview">
                </div>

                <div class="col-12">
                  <button id="btnUpload" type="button" class="btn btn-sm btn-outline-primary">Converter & Enviar</button>
                </div>

                <div class="col-12">
                  <label class="form-label">Resumo</label>
                  <textarea id="excerpt" class="form-control" rows="2"></textarea>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Categorias (vírgulas)</label>
                  <input id="categories" class="form-control" placeholder="Infraestruturas, Habitação">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Tags (vírgulas)</label>
                  <input id="tags" class="form-control" placeholder="Investimento, Emprego">
                </div>
                <div class="col-12">
                  <label class="form-label">Conteúdo (HTML/Markdown)</label>
                  <textarea id="content" class="form-control" rows="6"></textarea>
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer flex-column align-items-stretch">
            <div class="d-flex w-100 justify-content-between">
              <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button id="btnSave" class="btn btn-primary">Guardar</button>
            </div>
            <div id="saveStatus" class="small text-muted mt-2"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Configure these if hosting elsewhere:
      const API_BASE = (window.NEWS_API_BASE || "https://hs-node-api.vercel.app/api");
      const ADMIN_KEY = (window.NEWS_ADMIN_KEY || "supersecret");

      const tblBody = document.querySelector("#tbl tbody");
      let modal;
      const el = id => document.getElementById(id);

      function toSlug(str){
        return String(str || 'noticia')
          .toLowerCase()
          .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
          .replace(/[^a-z0-9]+/g,'-')
          .replace(/(^-|-$)/g,'')
          .slice(0,80);
      }

      function showStep(msg) {
        const s = el("saveStatus");
        if (s) s.textContent = msg || "";
      }

      function setSaving(isSaving) {
        const btn = el("btnSave");
        const closeBtn = document.querySelector("#newsModal .btn-close");
        const uploadBtn = document.getElementById("btnUpload");
        [btn, closeBtn, uploadBtn].forEach(b => { if (b) b.disabled = !!isSaving; });
        if (btn) btn.classList.toggle("disabled", !!isSaving);
      }

      function resetForm() {
        ["id","title","slug","date","author","cover","excerpt","categories","tags","content"]
          .forEach(id => { if (el(id)) el(id).value = (id === "author" ? "H&S Angola" : ""); });
        if (el("coverFile")) el("coverFile").value = "";
        if (el("preview")) { el("preview").src = ""; el("preview").classList.add("d-none"); }
        if (el("coverStatus")) el("coverStatus").textContent = "";
        showStep("");
        lastWebpDataUrl = null;
        lastWebpFileName = null;
      }

      let lastWebpDataUrl = null;
      let lastWebpFileName = null;

      function toCSV(str) {
        return (str||"").split(",").map(s=>s.trim()).filter(Boolean);
      }
      function fmtDate(d) {
        try { return new Date(d).toLocaleString(); } catch { return d; }
      }

      async function list() {
        const params = new URLSearchParams({ page: 1, limit: 100, q: el("search").value || "" });
        if (el("filterCategory").value) params.set("category", el("filterCategory").value);
        if (el("filterTag").value) params.set("tag", el("filterTag").value);

        const r = await fetch(`${API_BASE}/news?${params.toString()}`);
        const js = await r.json();
        renderTable(js.data || []);
      }

      function renderTable(rows) {
        tblBody.innerHTML = "";
        rows.forEach(r => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${r.cover ? `<img src="${r.cover}" class="thumb-preview">` : "-"}</td>
            <td>${r.title || ""}</td>
            <td>${fmtDate(r.date)}</td>
            <td>${r.author || ""}</td>
            <td>${(r.categories||[]).join(", ")}</td>
            <td>${(r.tags||[]).join(", ")}</td>
            <td>
              <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-primary" data-act="edit">Editar</button>
                <button class="btn btn-outline-danger" data-act="del">Apagar</button>
              </div>
            </td>
          `;
          tr.querySelector("[data-act='edit']").addEventListener("click", () => openEdit(r));
          tr.querySelector("[data-act='del']").addEventListener("click", () => removeItem(r));
          tblBody.appendChild(tr);
        });
      }

      function openEdit(r) {
        document.querySelector(".modal-title").textContent = r ? "Editar Notícia" : "Nova Notícia";
        el("id").value = r?._id || r?.id || "";
        el("title").value = r?.title || "";
        el("slug").value = r?.slug || "";
        el("date").value = r?.date ? new Date(r.date).toISOString().slice(0,16) : "";
        el("author").value = r?.author || "H&S Angola";
        el("cover").value = r?.cover || "";
        el("excerpt").value = r?.excerpt || "";
        el("categories").value = (r?.categories || []).join(", ");
        el("tags").value = (r?.tags || []).join(", ");
        el("content").value = r?.content || "";
        el("preview").src = r?.cover || "";
        el("preview").classList.toggle("d-none", !r?.cover);
        el("coverStatus").textContent = "";
        el("coverFile").value = "";
        modal.show();
      }

      async function removeItem(r) {
        if (!confirm(`Apagar "${r.title}"?`)) return;
        await fetch(`${API_BASE}/news/${encodeURIComponent(r._id || r.id)}`, {
          method: "DELETE",
          headers: { "x-admin-key": ADMIN_KEY }
        });
        list();
      }

      // -------- WEBP conversion (client) --------
      async function fileToWebpDataUrl(file, opts = 0.95) {
        const quality = typeof opts === 'number' ? opts : (opts.quality ?? 0.9);
        const maxW    = typeof opts === 'number' ? Infinity : (opts.maxW ?? Infinity);
        const maxH    = typeof opts === 'number' ? Infinity : (opts.maxH ?? Infinity);

        // Create bitmap (handles EXIF rotation in most browsers)
        let bmp;
        try {
          bmp = await createImageBitmap(file);
        } catch {
          // Fallback
          const srcDataUrl = await new Promise((res, rej) => {
            const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file);
          });
          const img = await new Promise((res, rej) => {
            const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = srcDataUrl;
          });
          bmp = { width: img.width, height: img.height, _img: img };
        }

        // Compute resize (keep aspect ratio)
        const sw = bmp.width, sh = bmp.height;
        const scale = Math.min(1, (isFinite(maxW) ? maxW / sw : 1), (isFinite(maxH) ? maxH / sh : 1));
        const tw = Math.max(1, Math.round(sw * scale));
        const th = Math.max(1, Math.round(sh * scale));

        const canvas = document.createElement('canvas');
        canvas.width = tw; canvas.height = th;
        const ctx = canvas.getContext('2d');

        // Draw source → canvas
        if (bmp._img) ctx.drawImage(bmp._img, 0, 0, tw, th);
        else ctx.drawImage(bmp, 0, 0, tw, th);

        // Encode to WEBP data URL
        const dataUrl = await new Promise((resolve) => canvas.toBlob(blob => {
          const fr = new FileReader(); fr.onload = () => resolve(fr.result);
          fr.readAsDataURL(blob);
        }, 'image/webp', quality));

        return dataUrl;
      }

      async function handleUpload() {
        let dataUrlToSend = lastWebpDataUrl;
        let filenameToSend = lastWebpFileName;

        // If user didn't trigger change (edge case), convert on demand
        if (!dataUrlToSend) {
          const file = el("coverFile").files?.[0];
          if (!file) { alert("Selecione um ficheiro primeiro."); return; }
          el("coverStatus").textContent = "A converter para WEBP...";
          dataUrlToSend = await fileToWebpDataUrl(file, 0.95);
          filenameToSend = file.name.replace(/\.[^.]+$/, '') + ".webp";

          // Also show preview
          el("preview").src = dataUrlToSend;
          el("preview").classList.remove("d-none");
        }

        // Send to API
        el("coverStatus").textContent = "A enviar para o armazenamento...";
        const r = await fetch(`${API_BASE}/upload`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-admin-key": ADMIN_KEY },
          body: JSON.stringify({ dataUrl: dataUrlToSend, filename: filenameToSend })
        });
        const js = await r.json();
        if (!r.ok) {
          el("coverStatus").textContent = `Erro no upload: ${js.error || r.status}`;
          return;
        }

        el("cover").value = js.url;
        el("coverStatus").innerHTML = `OK: <a href="${js.url}" target="_blank">${js.url}</a>`;
      }

      // Guardar: convert → upload → save
      document.getElementById("btnSave").addEventListener("click", async () => {
        try {
          setSaving(true);
          showStep("A preparar...");

          // If a file is selected, convert & upload automatically
          const file = el("coverFile").files?.[0];
          if (file) {
            showStep("A converter imagem para WEBP...");
            const webp = lastWebpDataUrl || await fileToWebpDataUrl(file, { maxW: 1600, quality: 0.85 });
            lastWebpDataUrl = webp;
            lastWebpFileName = file.name.replace(/\.[^.]+$/, '') + ".webp";

            showStep("A enviar imagem...");
            const r = await fetch(`${API_BASE}/upload`, {
              method: "POST",
              headers: { "Content-Type": "application/json", "x-admin-key": ADMIN_KEY },
              body: JSON.stringify({ dataUrl: webp, filename: lastWebpFileName })
            });
            const js = await r.json();
            if (!r.ok) throw new Error(js.error || "Falha no upload");
            el("cover").value = js.url; // use uploaded WEBP
          }

          // Build payload
          showStep("A guardar...");
          const body = {
            title: el("title").value,
            slug: el("slug").value || undefined, // leave blank to auto
            date: el("date").value ? new Date(el("date").value).toISOString() : undefined,
            author: el("author").value || undefined,
            cover: el("cover").value || undefined,
            excerpt: el("excerpt").value || undefined,
            categories: toCSV(el("categories").value),
            tags: toCSV(el("tags").value),
            content: el("content").value || undefined
          };
          const id = el("id").value;
          const method = id ? "PUT" : "POST";
          const url = id ? `${API_BASE}/news/${encodeURIComponent(id)}` : `${API_BASE}/news`;

          const saveRes = await fetch(url, {
            method,
            headers: { "Content-Type": "application/json", "x-admin-key": ADMIN_KEY },
            body: JSON.stringify(body)
          });
          if (!saveRes.ok) {
            const js = await saveRes.json().catch(()=> ({}));
            throw new Error(js.error || `Erro ${saveRes.status}`);
          }

          showStep("Feito.");
          // Clean UI and close
          resetForm();
          modal.hide();
          await list();
        } catch (err) {
          showStep(`Erro: ${err.message || err}`);
        } finally {
          setSaving(false);
        }
      });

      document.getElementById("btnRefresh").addEventListener("click", list);
      document.getElementById("search").addEventListener("keydown", (e)=>{ if (e.key === "Enter") list(); });
      document.getElementById("btnUpload").addEventListener("click", handleUpload);
      document.getElementById("btnPaste").addEventListener("click", async () => {
        try {
          const text = await navigator.clipboard.readText();
          el("cover").value = text;
          el("coverStatus").textContent = "URL colada.";
        } catch { el("coverStatus").textContent = "Não foi possível ler da área de transferência."; }
      });

      // Preview as soon as a file is selected (and pre-convert to WEBP once)
      el("coverFile").addEventListener("change", async (e) => {
        console.log("File selected event triggered");
        const file = e.target.files?.[0];
        if (!file) {
          console.log("No file selected");
          el("preview").classList.add("d-none");
          el("preview").src = "";
          el("coverStatus").textContent = "";
          lastWebpDataUrl = null;
          lastWebpFileName = null;
          return;
        }

        console.log("File selected:", file.name);
        el("coverStatus").textContent = "A preparar pré-visualização...";
        try {
          // Pre-convert once so clicking "Converter & Enviar" is instant
          lastWebpDataUrl = await fileToWebpDataUrl(file, 0.95);
          lastWebpFileName = file.name.replace(/\.[^.]+$/, '') + ".webp";

          // Show preview now (already WEBP)
          el("preview").src = lastWebpDataUrl;
          el("preview").classList.remove("d-none");
          el("coverStatus").textContent = "Pronto para enviar.";
          console.log("Preview set to:", lastWebpDataUrl.substring(0, 50) + "...");
          // Add onload listener to confirm image loads
          el("preview").onload = () => console.log("Preview image loaded successfully");
          el("preview").onerror = () => console.error("Preview image failed to load");
        } catch (err) {
          console.error("Error during preview prep:", err);
          el("coverStatus").textContent = "Erro ao preparar pré-visualização.";
        }
      });

      // Auto-set slug from title
      el("title").addEventListener("input", () => {
        if (!el("slug")) return;
        el("slug").value = toSlug(el("title").value);
      });

      // Passcode protection
      const passcodeCorrect = "hsluanda2025";
      window.addEventListener('load', () => {
        // Auth modal
        const authModal = new bootstrap.Modal(document.getElementById('authModal'), { backdrop: 'static', keyboard: false });
        authModal.show();
        document.getElementById('btnAuth').addEventListener('click', () => {
          const pass = document.getElementById('passcode').value;
          if (pass === passcodeCorrect) {
            authModal.hide();
            document.getElementById('adminContent').style.display = 'block';
          } else {
            alert('Palavra-passe incorreta!');
          }
        });
        document.getElementById('passcode').addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            document.getElementById('btnAuth').click();
          }
        });

        modal = new bootstrap.Modal(el("newsModal"));
        // Hide manual upload button (now auto in save)
        document.getElementById("btnUpload")?.classList.add("d-none");
      });

      // init
      list();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  </body>
</html>
